[project]
name = "hybrid-rag-assistant"
version = "0.1.0"
description = "Document Q&A with hybrid search and passage citations for PDFs, text files, and Markdown."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.16,<0.4",
    "chromadb>=1.5.9,<2",
    "cohere>=7.3,<8",
    "deepagents>=0.7.41",
    "dotenv>=0.9.9",
    "filelock>=3,<5",
    "langchain>=1.5.2",
    "langchain-openai>=1.8.5",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.5",
    "pypdf>=7.1.1",
    "requests>=2.34.2",
]

[project.scripts]
hybrid-rag-assistant = "langchain_chatbot:main"
langchain-chatbot = "langchain_chatbot:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "langchain_chatbot"
